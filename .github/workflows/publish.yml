name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# OIDC for npm trusted publishing. Do not set setup-node registry-url:
# that injects NODE_AUTH_TOKEN=XXXXX-... and npm skips OIDC.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Probe npm OIDC exchange
        run: |
          echo "repository=$GITHUB_REPOSITORY"
          echo "workflow_ref=$GITHUB_WORKFLOW_REF"
          echo "event=$GITHUB_EVENT_NAME"
          node <<'NODE'
          const ghUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent("npm:registry.npmjs.org");
          const gh = await fetch(ghUrl, { headers: { Authorization: "Bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          if (!gh.ok) {
            console.log("github_oidc_status=" + gh.status);
            console.log(await gh.text());
            process.exit(0);
          }
          const jwt = (await gh.json()).value;
          const payload = JSON.parse(Buffer.from(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"), "base64").toString());
          console.log("github_claims=" + JSON.stringify({
            aud: payload.aud,
            sub: payload.sub,
            repository: payload.repository,
            job_workflow_ref: payload.job_workflow_ref,
            event_name: payload.event_name,
            environment: payload.environment || null
          }, null, 2));
          const pkg = encodeURIComponent("@palmtom/pi-models");
          const urls = [
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/" + pkg,
            "https://registry.npmjs.org/-/npm/v1/oidc/token/" + pkg,
            "https://registry.npmjs.org/-/v1/oidc/token/exchange/" + pkg
          ];
          for (const url of urls) {
            const res = await fetch(url, {
              method: "POST",
              headers: {
                Authorization: "Bearer " + jwt,
                Accept: "application/json",
                "Content-Type": "application/json"
              }
            });
            const body = await res.text();
            console.log("npm_exchange " + res.status + " " + url);
            console.log(body.slice(0, 800));
          }
          NODE
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "$NPM_TOKEN" ]; then
            echo "Using GitHub secret NPM_TOKEN"
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "Using GitHub OIDC trusted publishing (no NPM_TOKEN secret)"
          fi
          npm publish --access public
