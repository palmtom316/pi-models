name: Publish Package

on:
  push:
    tags:
      - "v*"

# OIDC for npm trusted publishing. Do not set setup-node registry-url:
# that injects NODE_AUTH_TOKEN=XXXXX-... and npm skips OIDC.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require annotated tag to match package.json version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$expected" ]; then
            echo "Ref $tag does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
