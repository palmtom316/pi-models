name: Publish Package

on:
  push:
    tags:
      - "v*"

# Prefer npm trusted publishing (OIDC). Do not set setup-node registry-url:
# that injects NODE_AUTH_TOKEN and npm skips OIDC. If the package has no
# Trusted Publisher on npmjs.com, fall back to the NPM_TOKEN secret.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require annotated tag to match package.json version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$expected" ]; then
            echo "Ref $tag does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          unset NODE_AUTH_TOKEN
          if ! npm publish --access public; then
            if [ -z "$NPM_TOKEN" ]; then
              echo "npm publish failed (OIDC) and NPM_TOKEN is not set"
              exit 1
            fi
            echo "OIDC trusted publishing failed; retrying with NPM_TOKEN"
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            npm publish --access public
          fi
